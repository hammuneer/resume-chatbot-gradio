[project]
name = "resume-chatbot"
version = "0.1.0"
description = "An AI-powered chatbot built with Gradio and OpenAI that answers career-related questions grounded in a resume PDF."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hamza Munir" }]
dependencies = [
    "gradio>=4.44,<5",
    "openai>=1.40,<2",
    "pypdf>=4.3,<5",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
resume-chatbot = "resume_chatbot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
